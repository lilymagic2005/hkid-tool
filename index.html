<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <title>香港身份證號碼產生器與驗證器 (標準 Modulo-11)</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang HK", "Microsoft JhengHei", sans-serif;
      background-color: #f7f9fc;
      margin: 40px auto;
      max-width: 960px;
      padding: 0 20px;
    }
    .card {
      background: #ffffff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    h2 {
      margin-top: 0;
      margin-bottom: 20px;
      color: #1a202c;
      font-size: 20px;
    }

    /* 頂部雙欄並排佈局 */
    .top-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid #edf2f7;
    }

    /* 左側：設定控制面板 */
    .generator-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .control-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .radio-group {
      display: flex;
      align-items: center;
      gap: 12px;
      background-color: #edf2f7;
      padding: 6px 12px;
      border-radius: 6px;
    }
    .radio-group label {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      color: #2d3748;
      cursor: pointer;
    }
    .radio-group input[type="radio"] {
      cursor: pointer;
      margin: 0;
    }
    .input-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .input-group label {
      font-size: 13px;
      color: #4a5568;
    }
    input[type="number"] {
      width: 65px;
      padding: 6px 8px;
      font-size: 13px;
      border: 1px solid #cbd5e0;
      border-radius: 4px;
      background-color: #fff;
    }

    /* 按鈕樣式 */
    button {
      padding: 7px 14px;
      font-size: 13px;
      cursor: pointer;
      border: none;
      border-radius: 4px;
      color: white;
      transition: background-color 0.15s ease;
      white-space: nowrap;
    }
    .btn-primary { background-color: #0066cc; }
    .btn-primary:hover { background-color: #0052a3; }
    .btn-batch { background-color: #4a5568; }
    .btn-batch:hover { background-color: #2d3748; }

    /* 右側：驗證器面板 */
    .validator-box {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 14px 16px;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .validator-box .title {
      font-size: 13px;
      font-weight: 600;
      color: #4a5568;
    }
    .validator-input-row {
      display: flex;
      gap: 8px;
    }
    .validator-input-row input {
      flex: 1;
      padding: 6px 10px;
      font-size: 13px;
      border: 1px solid #cbd5e0;
      border-radius: 4px;
      text-transform: uppercase;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .val-result {
      font-size: 12px;
      min-height: 16px;
      margin: 0;
    }
    .val-success {
      color: #28a745;
      font-weight: 600;
    }
    .val-error {
      color: #dc3545;
      font-weight: 600;
    }

    /* 表格區域 */
    .table-container {
      max-height: 460px;
      overflow-y: auto;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    thead {
      position: sticky;
      top: 0;
      background-color: #edf2f7;
      z-index: 1;
    }
    th, td {
      padding: 10px 14px;
      border-bottom: 1px solid #edf2f7;
      vertical-align: middle;
    }
    th {
      font-size: 12px;
      color: #4a5568;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    td.mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 14px;
      font-weight: 600;
      color: #2d3748;
    }
    .btn-copy {
      padding: 4px 8px;
      font-size: 12px;
      background-color: #28a745;
    }
    .btn-copy:hover {
      background-color: #218838;
    }
    .btn-copied {
      background-color: #6c757d !important;
    }
    .notice {
      margin-top: 15px;
      font-size: 12px;
      color: #718096;
      line-height: 1.5;
    }

    @media (max-width: 768px) {
      .top-section {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<div class="card">
  <h2>香港身份證號碼產生器</h2>

  <!-- 頂部區塊：設定位置與驗證器並排 -->
  <div class="top-section">
    <!-- 左邊：設定控制項 (分為兩行) -->
    <div class="generator-panel">
      <!-- 第一行：字母選項 + 數量 + 產生號碼按鈕 -->
      <div class="control-row">
        <div class="radio-group">
          <label>
            <input type="radio" name="prefixLength" value="single" checked>
            1 個字母
          </label>
          <label>
            <input type="radio" name="prefixLength" value="double">
            2 個字母
          </label>
        </div>

        <div class="input-group">
          <label for="count">數量：</label>
          <input type="number" id="count" value="10" min="1" max="1000">
        </div>

        <button class="btn-primary" onclick="generateList()">產生號碼</button>
      </div>

      <!-- 第二行：複製全部按鈕 -->
      <div class="control-row">
        <button class="btn-batch" onclick="copyAll('with')">複製全部 (有括號)</button>
        <button class="btn-batch" onclick="copyAll('without')">複製全部 (無括號)</button>
      </div>
    </div>

    <!-- 右邊：身份證號碼驗證 (HKID Validator) -->
    <div class="validator-box">
      <div class="title">身份證號碼驗證 (HKID Validator)</div>
      <div class="validator-input-row">
        <input type="text" id="verifyInput" placeholder="例: A123456(3) 或 E9777303" onkeydown="if(event.key==='Enter') validateInputHKID()">
        <button class="btn-primary" onclick="validateInputHKID()">驗證</button>
      </div>
      <p id="verifyResult" class="val-result"></p>
    </div>
  </div>

  <!-- 資料表格 -->
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>有括號格式</th>
          <th>操作</th>
          <th>無括號格式</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="hkidTableBody"></tbody>
    </table>
  </div>

  <p class="notice">
    * 註：本工具產生的號碼僅供系統測試 (QA / Unit Test) 及開發驗證使用。<br>
    * 算法採用標準 Modulo-11：英文字母為 A=10 至 Z=35；1 個字母時前置空格權重為 36 × 9，2 個字母時為 字母1 × 9 + 字母2 × 8。
  </p>
</div>

<script>
// 標準 Modulo-11 Check Digit 計算公式
function calculateCheckDigit(prefix, digits) {
  let sum = 0;
  if (prefix.length === 1) {
    sum += 36 * 9;
    sum += (prefix.charCodeAt(0) - 55) * 8;
  } else if (prefix.length === 2) {
    sum += (prefix.charCodeAt(0) - 55) * 9;
    sum += (prefix.charCodeAt(1) - 55) * 8;
  }

  const weights = [7, 6, 5, 4, 3, 2];
  for (let i = 0; i < 6; i++) {
    sum += parseInt(digits[i], 10) * weights[i];
  }

  const remainder = sum % 11;
  if (remainder === 0) return '0';
  if (remainder === 1) return 'A';
  return (11 - remainder).toString();
}

// 產生有效身份證號碼
function generateValidHKID(prefixType) {
  const singleLetters = 'ABCDEFGHJKLMNPRSTVYZ';
  const allLetters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

  let prefix = '';
  if (prefixType === 'double') {
    const char1 = allLetters.charAt(Math.floor(Math.random() * allLetters.length));
    const char2 = allLetters.charAt(Math.floor(Math.random() * allLetters.length));
    prefix = char1 + char2;
  } else {
    prefix = singleLetters.charAt(Math.floor(Math.random() * singleLetters.length));
  }

  let digits = '';
  for (let i = 0; i < 6; i++) {
    digits += Math.floor(Math.random() * 10).toString();
  }

  const checkDigit = calculateCheckDigit(prefix, digits);

  return {
    withBrackets: `${prefix}${digits}(${checkDigit})`,
    withoutBrackets: `${prefix}${digits}${checkDigit}`
  };
}

// 驗證身份證字號
function validateInputHKID() {
  const inputEl = document.getElementById('verifyInput');
  const resultEl = document.getElementById('verifyResult');
  const rawVal = inputEl.value.trim().toUpperCase().replace(/[\(\)\s]/g, '');

  if (!rawVal) {
    resultEl.className = 'val-result val-error';
    resultEl.innerText = '請輸入身份證號碼';
    return;
  }

  const regex = /^([A-Z]{1,2})([0-9]{6})([0-9A])$/;
  const match = rawVal.match(regex);

  if (!match) {
    resultEl.className = 'val-result val-error';
    resultEl.innerText = '格式不合 (需為 1-2 位字母 + 6 位數字 + 校驗碼)';
    return;
  }

  const prefix = match[1];
  const digits = match[2];
  const givenCheckDigit = match[3];

  const expectedCheckDigit = calculateCheckDigit(prefix, digits);

  if (givenCheckDigit === expectedCheckDigit) {
    resultEl.className = 'val-result val-success';
    resultEl.innerText = `✓ 驗證通過 (${prefix}${digits}(${givenCheckDigit}) 為有效號碼)`;
  } else {
    resultEl.className = 'val-result val-error';
    resultEl.innerText = `✕ 驗證失敗 (校驗碼錯誤，正確應為 ${expectedCheckDigit})`;
  }
}

let generatedItems = [];

function generateList() {
  const count = parseInt(document.getElementById('count').value, 10) || 1;
  const selectedRadio = document.querySelector('input[name="prefixLength"]:checked');
  const prefixType = selectedRadio ? selectedRadio.value : 'single';

  const tbody = document.getElementById('hkidTableBody');
  tbody.innerHTML = '';
  generatedItems = [];

  for (let i = 0; i < count; i++) {
    const item = generateValidHKID(prefixType);
    generatedItems.push(item);

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="mono">${item.withBrackets}</td>
      <td>
        <button class="btn-copy" onclick="copyToClipboard('${item.withBrackets}', this)">複製</button>
      </td>
      <td class="mono">${item.withoutBrackets}</td>
      <td>
        <button class="btn-copy" onclick="copyToClipboard('${item.withoutBrackets}', this)">複製</button>
      </td>
    `;
    tbody.appendChild(tr);
  }
}

function copyToClipboard(text, btnElement) {
  navigator.clipboard.writeText(text).then(() => {
    const originalText = btnElement.innerText;
    btnElement.innerText = '已複製!';
    btnElement.classList.add('btn-copied');
    setTimeout(() => {
      btnElement.innerText = originalText;
      btnElement.classList.remove('btn-copied');
    }, 1000);
  });
}

function copyAll(type) {
  if (generatedItems.length === 0) return;

  const text = generatedItems
    .map(item => type === 'with' ? item.withBrackets : item.withoutBrackets)
    .join('\n');

  navigator.clipboard.writeText(text).then(() => {
    const typeLabel = type === 'with' ? '有括號' : '無括號';
    alert(`已複製 ${generatedItems.length} 個身份證號碼 (${typeLabel}) 到剪貼簿！`);
  });
}

// 載入時預設產生 10 組
generateList();
</script>

</body>
</html>
